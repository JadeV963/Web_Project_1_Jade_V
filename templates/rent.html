{% extends "base.html" %}
{% block title %}Rent {{ artwork.title }}{% endblock %}
{% block content %}
<div class="form-page">
    <div class="form-card">
        <h1>Rent "{{ artwork.title }}"</h1>
        <p>by {{ artwork.artist_name}} - ${{ artwork.price_per_month }}/month</p>
        <form method="POST">
            <label for="start_date">Start date:</label>
            <input type="date" name="start_date" min="{{today}}"><br>
            <label for="end_date">
            <input type="date" name="end_date" min="{{today}}"><br>
            <input type="submit" value="Submit request">
        </form>
    </div>
</div>    
    
{% endblock %}
